[project]
name = "geekbrain-ai-api"
version = "0.1.0"
description = "GeekBrain AI Q&A System - RAG + Tools + Memory"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "pydantic>=2.7",
    "mangum>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx[http2]>=0.27",
]

[project.scripts]
geekbrain = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring AWS/API",
]
