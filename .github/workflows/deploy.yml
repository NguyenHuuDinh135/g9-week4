name: Deploy GeekBrain AI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geekbrain-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
          terraform_wrapper: false

      - name: Install Python deps for index creation
        run: pip install boto3 opensearch-py requests-aws4auth

      # --- Phase 1: Terraform (ECR + infra, NO KB/Lambda yet) ---
      - name: Terraform Init
        working-directory: geekbrain-ai/infra
        run: terraform init

      - name: Remove obsolete resources from state
        working-directory: geekbrain-ai/infra
        run: |
          terraform state rm time_sleep.wait_for_opensearch 2>/dev/null || true
          terraform state rm null_resource.create_opensearch_index 2>/dev/null || true

      - name: Terraform Apply - Base Infra
        working-directory: geekbrain-ai/infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.api \
            -target=aws_ecr_repository.monitoring \
            -target=aws_s3_bucket.knowledge_base \
            -target=aws_s3_bucket.frontend \
            -target=aws_cloudfront_origin_access_identity.frontend \
            -target=aws_s3_bucket_policy.frontend \
            -target=aws_cloudfront_distribution.frontend \
            -target=aws_opensearchserverless_collection.kb \
            -target=aws_opensearchserverless_access_policy.kb_data \
            -target=aws_opensearchserverless_security_policy.kb_encryption \
            -target=aws_opensearchserverless_security_policy.kb_network

      - name: Get ECR URLs and OpenSearch Endpoint
        id: infra
        working-directory: geekbrain-ai/infra
        run: |
          echo "api_url=$(terraform output -raw ecr_api_url)" >> $GITHUB_OUTPUT
          echo "monitoring_url=$(terraform output -raw ecr_monitoring_url)" >> $GITHUB_OUTPUT
          echo "opensearch_endpoint=$(terraform output -raw opensearch_collection_endpoint)" >> $GITHUB_OUTPUT

      # --- Phase 2: Create OpenSearch Index (outside Terraform) ---
      - name: Wait for access policy propagation
        run: echo "Waiting 120s for OpenSearch access policy to propagate..." && sleep 120

      - name: Create OpenSearch Vector Index
        working-directory: geekbrain-ai/infra
        run: python3 scripts/create_index.py ${{ steps.infra.outputs.opensearch_endpoint }}

      # --- Phase 3: Build & Push Container Images ---
      - name: Build Monitoring API Image
        working-directory: geekbrain-ai/data_package/scripts
        run: docker build -t ${{ steps.infra.outputs.monitoring_url }}:latest .

      - name: Push Monitoring API Image
        run: docker push ${{ steps.infra.outputs.monitoring_url }}:latest

      - name: Prepare API Build Context
        working-directory: geekbrain-ai/apps/api
        run: cp ../../data_package/scripts/geekbrain.db ./geekbrain.db

      - name: Build API Image
        working-directory: geekbrain-ai/apps/api
        run: docker build -t ${{ steps.infra.outputs.api_url }}:latest .

      - name: Push API Image
        run: docker push ${{ steps.infra.outputs.api_url }}:latest

      # --- Phase 4: Terraform Apply Full (KB + Lambda + API GW) ---
      - name: Terraform Apply - Full
        working-directory: geekbrain-ai/infra
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf
        working-directory: geekbrain-ai/infra
        run: |
          echo "kb_id=$(terraform output -raw knowledge_base_id)" >> $GITHUB_OUTPUT
          echo "ds_id=$(terraform output -raw data_source_id)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT

      # --- Frontend (S3 + CloudFront) ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Frontend (static export)
        working-directory: geekbrain-ai/apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.tf.outputs.api_url }}
          BACKEND_URL: ${{ steps.tf.outputs.api_url }}
        run: bun run build

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync apps/web/.next/static s3://${{ steps.tf.outputs.frontend_bucket }}/_next/static \
            --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/web/.next/server/app/index.html s3://${{ steps.tf.outputs.frontend_bucket }}/index.html \
            --cache-control "public, max-age=60" || true

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.cloudfront_id }} \
            --paths "/*"

      # --- KB Sync ---
      - name: Trigger KB Ingestion
        run: |
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id ${{ steps.tf.outputs.kb_id }} \
            --data-source-id ${{ steps.tf.outputs.ds_id }}
